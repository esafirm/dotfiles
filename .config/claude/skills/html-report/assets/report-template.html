<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>
  // Applied before first paint so the theme never flashes. Without a saved choice it follows the OS once.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("report-theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --page: #f7f7f5;
    --surface: #ffffff;
    --surface-2: #f1f0ed;
    --ink: #111110;
    --ink-2: #4f4e4a;
    --muted: #66655f;
    --border: rgba(17, 17, 16, 0.10);
    --border-strong: rgba(17, 17, 16, 0.18);
    --code-bg: #efeeea;
    --accent: #1f5fbf;
    --accent-soft: rgba(31, 95, 191, 0.10);
    --good: #13892f;
    --warn: #a86512;
    --critical: #c93636;
    --add-bg: rgba(46, 160, 67, 0.14);
    --del-bg: rgba(248, 81, 73, 0.14);
    --tk-keyword: #a626a4;
    --tk-string: #2f7a2e;
    --tk-number: #865d00;
    --tk-annotation: #8f5c00;
    --tk-type: #0a6f9c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
    --topbar-h: 56px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0f0f0e;
    --surface: #181817;
    --surface-2: #201f1d;
    --ink: #efeee9;
    --ink-2: #c2c0b6;
    --muted: #a9a79e;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.16);
    --code-bg: #24231f;
    --accent: #5b9bf0;
    --accent-soft: rgba(91, 155, 240, 0.14);
    --good: #4cc463;
    --warn: #e0a24a;
    --critical: #ef6b6b;
    --add-bg: rgba(46, 160, 67, 0.20);
    --del-bg: rgba(248, 81, 73, 0.18);
    --tk-keyword: #c678dd;
    --tk-string: #98c379;
    --tk-number: #d19a66;
    --tk-annotation: #e5c07b;
    --tk-type: #56b6c2;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 16px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    height: var(--topbar-h);
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    background: color-mix(in srgb, var(--page) 86%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-title { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .controls { display: flex; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px;
    font: 500 13px/1 var(--sans); color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
    cursor: pointer;
  }
  .btn:hover { color: var(--ink); border-color: var(--muted); }
  .btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .btn svg { width: 15px; height: 15px; }
  .menu-btn { display: none; padding: 0 9px; }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    gap: 48px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
  }
  main { max-width: 940px; min-width: 0; padding: 40px 0 96px; overflow-wrap: break-word; }

  /* Side contents */
  .toc {
    position: sticky; top: var(--topbar-h);
    align-self: start;
    max-height: calc(100vh - var(--topbar-h));
    overflow-y: auto;
    padding: 36px 4px 40px 0;
    font-size: 13.5px;
  }
  .toc-title { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 12px; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc ol ol { margin: 2px 0 6px; }
  .toc a {
    display: block; padding: 5px 10px 5px 12px;
    color: var(--ink-2); text-decoration: none;
    border-left: 2px solid transparent; border-radius: 0 6px 6px 0;
    line-height: 1.35;
  }
  .toc ol ol a { padding-left: 24px; font-size: 13px; color: var(--muted); }
  .toc a:hover { color: var(--ink); background: var(--surface-2); }
  .toc a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .scrim { display: none; }

  /* Type */
  h1 { font-size: 32px; line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 10px; }
  h2 {
    font-size: 22px; line-height: 1.3; letter-spacing: -0.01em;
    margin: 56px 0 16px; padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  h3 { font-size: 17px; margin: 32px 0 10px; }
  h2, h3, details { scroll-margin-top: calc(var(--topbar-h) + 16px); }
  p { margin: 0 0 14px; }
  ul, ol { margin: 0 0 16px; padding-left: 22px; }
  li { margin: 0 0 6px; }
  a { color: var(--accent); text-underline-offset: 2px; }
  strong { font-weight: 650; }
  .byline { color: var(--ink-2); font-size: 14px; margin-bottom: 28px; }
  .lead { font-size: 18px; line-height: 1.6; color: var(--ink); max-width: 760px; }
  .note { color: var(--ink-2); font-size: 14.5px; }
  .good { color: var(--good); }
  .warn { color: var(--warn); }
  .critical { color: var(--critical); }
  code, pre, .file .path, table.diff { font-variant-ligatures: common-ligatures contextual; font-feature-settings: "calt" 1, "liga" 1; }
  code { font: 0.92em/1.5 var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  td.num code, th code { overflow-wrap: normal; }
  pre { background: var(--code-bg); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0 0 16px; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 0 0 16px; padding: 4px 16px; border-left: 3px solid var(--border-strong); color: var(--ink-2); }

  /* Headline tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px; margin: 28px 0 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
  .tile .label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .tile .n { font-size: 27px; font-weight: 650; line-height: 1.15; margin-top: 6px; letter-spacing: -0.01em; }
  .tile .n .from { color: var(--muted); font-weight: 450; }
  .tile .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
  .tile .sub.good { color: var(--good); }

  /* Cards and callouts */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px 6px; margin: 0 0 18px; box-shadow: var(--shadow); }
  .callout { border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface); border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; }
  .callout.warn { border-left-color: var(--warn); color: inherit; }
  .callout.good { border-left-color: var(--good); color: inherit; }

  /* Tables */
  .table-wrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
  .table-wrap table { margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 0 0 18px; }
  th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--ink-2); font-weight: 600; font-size: 13px; background: var(--surface-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Bars */
  .bars { margin: 0 0 18px; }
  .bar-row { display: grid; grid-template-columns: 210px 1fr 120px; gap: 10px; align-items: center; margin: 0 0 10px; font-size: 14px; }
  .bar-row .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-track { position: relative; height: 18px; background: var(--code-bg); border-radius: 5px; overflow: hidden; }
  .bar-before { position: absolute; inset: 0 auto 0 0; background: var(--muted); opacity: 0.55; }
  .bar-after { position: absolute; inset: 0 auto 0 0; background: var(--good); }

  /* Outcome tags */
  .tag { display: inline-block; font-size: 11.5px; font-weight: 650; border-radius: 999px; padding: 2px 9px; margin-right: 6px; vertical-align: 1px; border: 1px solid currentColor; white-space: nowrap; }
  .tag.done { color: var(--good); }
  .tag.care { color: var(--warn); }
  .tag.skip { color: var(--muted); }
  .tag.open { color: var(--accent); }
  .tag.bad { color: var(--critical); }

  /* Change preview (generated diffs) */
  details.commit { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin: 0 0 10px; padding: 0 16px; box-shadow: var(--shadow); }
  details.commit > summary { position: relative; cursor: pointer; padding: 14px 0 14px 24px; font-weight: 600; font-size: 14.5px; line-height: 1.5; list-style: none; }
  details.commit > summary::-webkit-details-marker { display: none; }
  details.commit > summary::before { content: ""; position: absolute; left: 4px; top: 22px; border: 5px solid transparent; border-left: 7px solid var(--muted); border-right: 0; transition: transform 0.12s; }
  details.commit[open] > summary::before { transform: rotate(90deg); }
  details.commit[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  details.commit .hash { display: inline-block; margin-right: 10px; font-weight: 400; text-decoration: none; }
  details.commit .hash code { transition: background 0.12s; }
  details.commit .hash:hover code { background: var(--border); }
  details.commit .stat { display: block; margin-top: 3px; color: var(--muted); font-weight: 400; font-size: 13px; }
  details.commit > p.note { margin: 0 0 14px; line-height: 1.6; }
  details.commit > p.note + p.note { margin-top: -4px; }
  .file { margin: 0 0 16px; border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
  .file .path { font: 600 13.5px/1.4 var(--mono); padding: 8px 10px; background: var(--code-bg); border-bottom: 1px solid var(--border); position: sticky; left: 0; }
  table.diff { margin: 0; font: 13.5px/1.5 var(--mono); border-collapse: collapse; width: max-content; min-width: 100%; }
  table.diff td { border: 0; padding: 0 8px; white-space: pre; vertical-align: top; }
  table.diff td:nth-child(-n+2) { color: var(--muted); text-align: right; user-select: none; min-width: 3.5em; }
  table.diff tr.add { background: var(--add-bg); }
  table.diff tr.del { background: var(--del-bg); }
  table.diff tr.hunk td { color: var(--accent); background: var(--accent-soft); padding-top: 3px; padding-bottom: 3px; }
  table.diff .sign { color: var(--muted); user-select: none; margin-right: 6px; }
  .t-k { color: var(--tk-keyword); } .t-s { color: var(--tk-string); } .t-c { color: var(--muted); font-style: italic; }
  .t-n { color: var(--tk-number); } .t-a { color: var(--tk-annotation); } .t-ty { color: var(--tk-type); }

  /* Back to top */
  .to-top {
    position: fixed; right: 20px; bottom: 20px; z-index: 15;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); color: var(--ink-2); border: 1px solid var(--border-strong);
    box-shadow: var(--shadow); cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .to-top.visible { opacity: 1; pointer-events: auto; }

  /* Reader mode: no chrome, one comfortable reading column */
  html.reader .layout { grid-template-columns: minmax(0, 1fr); }
  html.reader .toc, html.reader .menu-btn { display: none; }
  html.reader .layout { max-width: 920px; }
  html.reader main { max-width: 820px; margin: 0 auto; padding-top: 56px; font-family: var(--serif); font-size: 22px; line-height: 1.75; }
  html.reader main h1, html.reader main h2, html.reader main h3 { font-family: var(--sans); }
  html.reader main h1 { font-size: 40px; }
  html.reader main h2 { font-size: 29px; }
  html.reader main h3 { font-size: 22px; }
  html.reader main .lead { font-size: 25px; }
  html.reader main .note, html.reader main .byline { font-size: 18px; }
  html.reader main table, html.reader main .tiles, html.reader main details, html.reader main .byline { font-family: var(--sans); line-height: 1.55; }
  html.reader main table { font-size: 17.5px; }
  html.reader main th { font-size: 15.5px; }
  html.reader main .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  html.reader main .tile .n { font-size: 32px; }
  html.reader main .tile .label, html.reader main .tile .sub { font-size: 15px; }
  html.reader main details { font-size: 17px; }
  html.reader .tile, html.reader .card, html.reader .table-wrap, html.reader details.commit { box-shadow: none; }

  /* Narrow screens: contents become a drawer */
  @media (max-width: 1000px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 18px; }
    .menu-btn { display: inline-flex; }
    .toc {
      position: fixed; top: var(--topbar-h); left: 0; bottom: 0; z-index: 30;
      width: 290px; max-height: none;
      padding: 20px 12px 40px 8px;
      background: var(--surface); border-right: 1px solid var(--border);
      transform: translateX(-100%); transition: transform 0.2s ease;
    }
    body.toc-open .toc { transform: none; }
    body.toc-open .scrim { display: block; position: fixed; inset: var(--topbar-h) 0 0 0; z-index: 25; background: rgba(0, 0, 0, 0.3); }
    .bar-row { grid-template-columns: 120px 1fr 90px; }
    h1 { font-size: 27px; }
    .btn .label-text { display: none; }
    .topbar { padding: 0 12px; gap: 8px; }
    .tile .n { font-size: 23px; }
  }


  /* Inline comments */
  mark.cmt { background: rgba(240, 190, 40, 0.38); color: inherit; border-radius: 2px; cursor: pointer; }
  :root[data-theme="dark"] mark.cmt { background: rgba(240, 190, 40, 0.28); }
  mark.cmt:hover, mark.cmt.cmt-open { background: rgba(240, 190, 40, 0.6); }
  .cmt-pop { position: absolute; z-index: 60; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); padding: 8px; font: 13px/1.4 var(--sans); color: var(--ink); }
  .cmt-pop[hidden] { display: none; }
  .cmt-pop textarea { display: block; width: 280px; max-width: 70vw; min-height: 76px; resize: vertical; box-sizing: border-box; padding: 8px; font: 14px/1.4 var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px; }
  .cmt-pop .row { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
  .cmt-pop .btn { height: 28px; }
  .cmt-pop .quote { max-width: 280px; margin: 0 0 8px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media print {
    .topbar, .toc, .scrim, .to-top, .cmt-pop { display: none !important; }
    mark.cmt { background: none; }
    .layout { display: block; max-width: none; padding: 0; }
    main { max-width: none; padding: 0; }
    details.commit { break-inside: avoid; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<header class="topbar">
  <button class="btn menu-btn" type="button" aria-label="Contents" aria-controls="toc">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <span class="topbar-title">{{TITLE}}</span>
  <div class="controls">
    <button class="btn" id="comments-copy" type="button" title="Copy all inline comments" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="label-text" id="comments-label">Copy comments</span>
    </button>
    <button class="btn" id="read-toggle" type="button" aria-pressed="false" title="Mark this report as read">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span class="label-text" id="read-label">Mark as read</span>
    </button>
    <button class="btn" id="theme-toggle" type="button" title="Switch theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="label-text" id="theme-label">Light</span>
    </button>
    <button class="btn" id="reader-toggle" type="button" aria-pressed="false" title="Reader mode (full screen)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>
      <span class="label-text">Reader</span>
    </button>
  </div>
</header>
<div class="layout">
  <nav class="toc" id="toc" aria-label="Contents">
    <div class="toc-title">Contents</div>
    <ol id="toc-list"></ol>
  </nav>
  <main id="content">
{{CONTENT}}
  </main>
</div>
<div class="scrim"></div>
<div class="cmt-pop" id="cmt-pop" hidden></div>
<button class="to-top" type="button" aria-label="Back to top">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
<script>
  (function () {
    var root = document.documentElement;
    var main = document.getElementById("content");

    // Mark as read: remembered per report file, so a reopened report shows whether it was already read.
    var readBtn = document.getElementById("read-toggle");
    var readLabel = document.getElementById("read-label");
    var readKey = "report-read:" + location.pathname;
    function applyRead(on, save) {
      readBtn.setAttribute("aria-pressed", on ? "true" : "false");
      readBtn.title = on ? "Marked as read. Click to mark as unread" : "Mark this report as read";
      readLabel.textContent = on ? "Read" : "Mark as read";
      if (save) { try { on ? localStorage.setItem(readKey, "1") : localStorage.removeItem(readKey); } catch (e) {} }
    }
    var wasRead = false;
    try { wasRead = localStorage.getItem(readKey) === "1"; } catch (e) {}
    applyRead(wasRead, false);
    readBtn.addEventListener("click", function () {
      applyRead(readBtn.getAttribute("aria-pressed") !== "true", true);
    });

    // Theme: light or dark, remembered across visits.
    var themeLabel = document.getElementById("theme-label");
    function applyTheme(theme, save) {
      root.setAttribute("data-theme", theme);
      themeLabel.textContent = theme === "dark" ? "Dark" : "Light";
      if (save) { try { localStorage.setItem("report-theme", theme); } catch (e) {} }
    }
    applyTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);
    document.getElementById("theme-toggle").addEventListener("click", function () {
      applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });

    // Reader mode: bigger type in one column, shown full screen. Leaving full screen (Esc) leaves reader mode.
    var readerBtn = document.getElementById("reader-toggle");
    function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function applyReader(on) {
      root.classList.toggle("reader", on);
      readerBtn.setAttribute("aria-pressed", on ? "true" : "false");
    }
    readerBtn.addEventListener("click", function () {
      var on = !root.classList.contains("reader");
      var anchor = links.filter(function (l) { return l.link.classList.contains("active"); })[0];
      applyReader(on);
      if (on && !isFullscreen()) {
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (request) { try { var p = request.call(root); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
      } else if (!on && isFullscreen()) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) { try { var q = exit.call(document); if (q && q.catch) q.catch(function () {}); } catch (e) {} }
      }
      // Keep the reader at the same section after the type size changes.
      if (anchor && window.scrollY > 200) requestAnimationFrame(function () { anchor.heading.scrollIntoView({ block: "start" }); });
    });
    function onFullscreenChange() { if (!isFullscreen() && root.classList.contains("reader")) applyReader(false); }
    document.addEventListener("fullscreenchange", onFullscreenChange);
    document.addEventListener("webkitfullscreenchange", onFullscreenChange);

    // Wrap plain tables so wide ones scroll instead of overflowing.
    Array.prototype.forEach.call(main.querySelectorAll("table:not(.diff)"), function (table) {
      if (table.parentElement.classList.contains("table-wrap")) return;
      var wrap = document.createElement("div");
      wrap.className = "table-wrap";
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });

    // Contents from h2/h3, with ids generated where missing.
    var used = {};
    function slug(text) {
      var base = text.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-").slice(0, 60) || "section";
      var id = base, n = 2;
      while (used[id] || (document.getElementById(id) && !used[id])) { id = base + "-" + n++; }
      used[id] = true;
      return id;
    }
    var list = document.getElementById("toc-list");
    var headings = main.querySelectorAll("h2, h3");
    var links = [];
    var currentSub = null;
    Array.prototype.forEach.call(headings, function (h) {
      if (h.closest("details")) return;
      if (!h.id) h.id = slug(h.textContent); else used[h.id] = true;
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = h.textContent;
      li.appendChild(a);
      if (h.tagName === "H2") {
        list.appendChild(li);
        currentSub = document.createElement("ol");
        li.appendChild(currentSub);
      } else {
        (currentSub || list).appendChild(li);
      }
      links.push({ heading: h, link: a });
    });
    Array.prototype.forEach.call(list.querySelectorAll("ol"), function (ol) { if (!ol.children.length) ol.remove(); });

    // Highlight the section being read.
    function setActive(link) {
      links.forEach(function (l) { l.link.classList.toggle("active", l.link === link); });
      if (link) {
        var r = link.getBoundingClientRect(), t = document.getElementById("toc").getBoundingClientRect();
        if (r.top < t.top || r.bottom > t.bottom) link.scrollIntoView({ block: "nearest" });
      }
    }
    function onScroll() {
      var offset = parseInt(getComputedStyle(root).getPropertyValue("--topbar-h"), 10) + 40;
      var active = null;
      for (var i = 0; i < links.length; i++) {
        if (links[i].heading.getBoundingClientRect().top - offset <= 0) active = links[i].link; else break;
      }
      setActive(active || (links[0] && links[0].link));
      document.querySelector(".to-top").classList.toggle("visible", window.scrollY > 800);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    // Drawer on narrow screens.
    document.querySelector(".menu-btn").addEventListener("click", function () { document.body.classList.toggle("toc-open"); });
    document.querySelector(".scrim").addEventListener("click", function () { document.body.classList.remove("toc-open"); });
    list.addEventListener("click", function (e) { if (e.target.tagName === "A") document.body.classList.remove("toc-open"); });

    document.querySelector(".to-top").addEventListener("click", function () { window.scrollTo({ top: 0 }); });

    // Inline comments: select text, add a note. Kept in localStorage per report file; "Copy comments" exports them.
    var pop = document.getElementById("cmt-pop");
    var copyBtn = document.getElementById("comments-copy");
    var copyLabel = document.getElementById("comments-label");
    var cmtKey = "report-comments:" + location.pathname;
    var comments = [];
    try { comments = JSON.parse(localStorage.getItem(cmtKey) || "[]"); } catch (e) {}
    function saveComments() {
      try { comments.length ? localStorage.setItem(cmtKey, JSON.stringify(comments)) : localStorage.removeItem(cmtKey); } catch (e) {}
      copyBtn.hidden = !comments.length;
      copyLabel.textContent = "Copy comments (" + comments.length + ")";
    }
    function textNodes() {
      var w = document.createTreeWalker(main, NodeFilter.SHOW_TEXT), out = [], pos = 0, n;
      while ((n = w.nextNode())) { out.push({ node: n, start: pos }); pos += n.data.length; }
      return { nodes: out, text: out.map(function (t) { return t.node.data; }).join("") };
    }
    function wrapRange(c) {
      var info = textNodes(), start = c.start;
      if (info.text.substr(start, c.quote.length) !== c.quote) {
        start = info.text.indexOf(c.quote);
        if (start < 0) return;
      }
      var end = start + c.quote.length;
      info.nodes.forEach(function (t) {
        var s = Math.max(start, t.start), e = Math.min(end, t.start + t.node.data.length);
        if (s >= e || !t.node.data.slice(s - t.start, e - t.start).trim()) return;
        var node = t.node;
        if (e - t.start < node.data.length) node.splitText(e - t.start);
        if (s - t.start > 0) node = node.splitText(s - t.start);
        var m = document.createElement("mark");
        m.className = "cmt"; m.dataset.cid = c.id; m.title = c.note;
        node.parentNode.insertBefore(m, node);
        m.appendChild(node);
      });
    }
    function unwrap(id) {
      Array.prototype.forEach.call(main.querySelectorAll('mark.cmt[data-cid="' + id + '"]'), function (m) {
        var p = m.parentNode;
        while (m.firstChild) p.insertBefore(m.firstChild, m);
        p.removeChild(m);
        p.normalize();
      });
    }
    function placePop(rect) {
      pop.hidden = false;
      var x = Math.min(Math.max(8, rect.left + scrollX), scrollX + innerWidth - pop.offsetWidth - 8);
      var y = rect.top + scrollY - pop.offsetHeight - 8;
      if (y < scrollY + 60) y = rect.bottom + scrollY + 8;
      pop.style.left = x + "px"; pop.style.top = y + "px";
    }
    function closePop() {
      pop.hidden = true; pop.innerHTML = "";
      Array.prototype.forEach.call(main.querySelectorAll("mark.cmt-open"), function (m) { m.classList.remove("cmt-open"); });
    }
    function button(label, onClick) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn"; b.textContent = label;
      b.addEventListener("click", onClick);
      return b;
    }
    function openEditor(rect, quote, note, onSave, onDelete) {
      pop.innerHTML = "";
      var q = document.createElement("div"); q.className = "quote"; q.textContent = "“" + quote + "”";
      var ta = document.createElement("textarea"); ta.value = note; ta.placeholder = "Comment";
      var row = document.createElement("div"); row.className = "row";
      if (onDelete) row.appendChild(button("Delete", onDelete));
      row.appendChild(button("Cancel", closePop));
      row.appendChild(button("Save", function () { if (ta.value.trim()) onSave(ta.value.trim()); }));
      ta.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closePop();
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && ta.value.trim()) onSave(ta.value.trim());
      });
      pop.appendChild(q); pop.appendChild(ta); pop.appendChild(row);
      placePop(rect);
      ta.focus();
    }
    function showSelection() {
      var sel = getSelection();
      if (!sel.rangeCount || sel.isCollapsed) return;
      var range = sel.getRangeAt(0);
      if (!main.contains(range.commonAncestorContainer)) return;
      var quote = range.toString();
      if (!quote.trim() || quote.length > 600) return;
      if (main.querySelector("mark.cmt") && Array.prototype.some.call(main.querySelectorAll("mark.cmt"), function (m) { return range.intersectsNode(m); })) return;
      var pre = document.createRange();
      pre.selectNodeContents(main); pre.setEnd(range.startContainer, range.startOffset);
      var start = pre.toString().length, rect = range.getBoundingClientRect();
      pop.innerHTML = "";
      pop.appendChild(button("Comment", function () {
        openEditor(rect, quote, "", function (note) {
          var c = { id: "c" + Date.now(), start: start, quote: quote, note: note };
          comments.push(c); saveComments(); wrapRange(c); closePop(); sel.removeAllRanges();
        });
      }));
      placePop(rect);
    }
    function sectionOf(el) {
      var hs = main.querySelectorAll("h2, h3"), found = "";
      Array.prototype.forEach.call(hs, function (h) {
        if (h.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) found = h.textContent;
      });
      return found;
    }
    pop.addEventListener("mousedown", function (e) { if (e.target.tagName !== "TEXTAREA") e.preventDefault(); });
    document.addEventListener("mouseup", function (e) {
      if (pop.contains(e.target)) return;
      var mark = e.target.closest && e.target.closest("mark.cmt");
      if (mark && getSelection().isCollapsed) {
        var c = comments.filter(function (x) { return x.id === mark.dataset.cid; })[0];
        if (!c) return;
        closePop(); mark.classList.add("cmt-open");
        openEditor(mark.getBoundingClientRect(), c.quote, c.note, function (note) {
          c.note = note; saveComments();
          Array.prototype.forEach.call(main.querySelectorAll('mark.cmt[data-cid="' + c.id + '"]'), function (m) { m.title = note; });
          closePop();
        }, function () {
          comments = comments.filter(function (x) { return x !== c; });
          saveComments(); unwrap(c.id); closePop();
        });
        return;
      }
      setTimeout(function () { closePop(); showSelection(); }, 0);
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePop(); });
    comments.forEach(wrapRange);
    saveComments();
    copyBtn.addEventListener("click", function () {
      var text = comments.map(function (c) {
        var m = main.querySelector('mark.cmt[data-cid="' + c.id + '"]');
        var where = m ? sectionOf(m) : "";
        return (where ? "[" + where + "]\n" : "") + "> " + c.quote.replace(/\s+/g, " ") + "\n" + c.note;
      }).join("\n\n");
      function done() { copyLabel.textContent = "Copied"; setTimeout(saveComments, 1200); }
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        ta.remove(); done();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    });

    // Opening a link to a collapsed section expands it.
    function openTargetCommit() {
      var target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target && target.tagName === "DETAILS") target.open = true;
    }
    addEventListener("hashchange", openTargetCommit);
    openTargetCommit();
  })();
</script>
</body>
</html>
